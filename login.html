<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login | Askamedia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    .login-container {
      background-color: #1f3a56;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 350px;
      text-align: center;
      color: #fff;
    }

    .login-container h2 {
      margin-bottom: 30px;
      color: #00bfff;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    .login-container input[type="email"],
    .login-container input[type="password"] {
      background: #fff;
      color: #000;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #00bfff;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    .login-container button:hover {
      background-color: #0099cc;
    }

    .error-message {
      color: #ff6b6b;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Teacher Login</h2>
    <div class="error-message" id="error-msg">Invalid credentials</div>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button onclick="loginTeacher()">Login</button>
  </div>

  <script>
    function loginTeacher() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      // Dummy validation (replace with real backend later)
      if (email === "teacher@askamedia.com" && password === "123456") {
        window.location.href = "teacher.html";
      } else {
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
