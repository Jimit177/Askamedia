<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Askamedia - Learn Smarter</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(to bottom right, #edf5ff, #ffffff);
      color: #16213e;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    header img {
      height: 50px;
    }
    header button {
      padding: 0.6rem 1.2rem;
      background-color: #16213e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    header button:hover {
      background-color: #0e1526;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4rem 6rem;
    }
    .hero-left {
      flex: 1;
    }
    .hero-left h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .hero-left p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #444;
    }
    .hero-left a {
      padding: 0.8rem 1.6rem;
      background-color: #16213e;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .hero-left a:hover {
      background-color: #0e1526;
    }
    .hero-right img, .hero-right svg {
      max-width: 500px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: #fff;
      padding: 2rem;
      border-radius: 12px;
      width: 100%; max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }
    .modal-content h2 {
      margin-bottom: 1rem;
      text-align: center;
    }
    .modal-content input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .modal-content button {
      width: 100%;
      padding: 0.8rem;
      background: #16213e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .toggle-link {
      margin-top: 1rem;
      text-align: center;
      cursor: pointer;
      color: #106cc0;
      text-decoration: underline;
      font-size: 0.9rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        padding: 2rem;
      }
      .hero-left, .hero-right {
        max-width: 100%;
        text-align: center;
      }
      .hero-right img {
        width: 100%;
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="./home.html"><img src="./header-logo.png" alt="Askamedia Logo"></a>
    <button id="login-btn">Login</button>
  </header>

  <section class="hero">
    <div class="hero-left">
      <h1>AI-Powered Student Support</h1>
      <p>Get personalized answers from your course material. Learn faster. Ask smarter. Only with Askamedia.</p>
      <a href="#" id="get-started">Get Started</a>
    </div>
    <div class="hero-right">
      <img src="./assets/chatbot-illustration.svg" alt="Chatbot Illustration">
    </div>
  </section>

  <!-- Login Modal -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <h2 id="modal-title">Login</h2>
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <input type="text" id="auth-name" placeholder="Full Name" style="display: none;">
      <button id="auth-submit">Login</button>
      <div class="toggle-link" id="toggle-auth">Don't have an account? Register</div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('auth-modal');
    const loginBtn = document.getElementById('login-btn');
    const toggleLink = document.getElementById('toggle-auth');
    const nameInput = document.getElementById('auth-name');
    const submitBtn = document.getElementById('auth-submit');
    const title = document.getElementById('modal-title');
    const getStarted = document.getElementById('get-started');

    let mode = 'login';

    loginBtn.onclick = () => modal.style.display = 'flex';
    getStarted.onclick = () => modal.style.display = 'flex';

    toggleLink.onclick = () => {
      if (mode === 'login') {
        mode = 'register';
        title.innerText = 'Register';
        nameInput.style.display = 'block';
        submitBtn.innerText = 'Register';
        toggleLink.innerText = 'Already have an account? Login';
      } else {
        mode = 'login';
        title.innerText = 'Login';
        nameInput.style.display = 'none';
        submitBtn.innerText = 'Login';
        toggleLink.innerText = "Don't have an account? Register";
      }
    }

    submitBtn.onclick = () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const name = document.getElementById('auth-name').value;

      const data = mode === 'login'
        ? { email, password }
        : { name, email, password };

      fetch(`http://localhost:5000/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          localStorage.setItem("loggedIn", "true");
          if (res.name) localStorage.setItem("userName", res.name);
          alert(`${mode === 'login' ? 'Logged in' : 'Registered'} successfully!`);
          window.location.href = 'course_selection.html';
        } else {
          alert(res.message || 'Error');
        }
      })
      .catch(err => {
        console.error(err);
        alert('Request failed.');
      });
    }

    window.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };
  </script>
</body>
</html>
